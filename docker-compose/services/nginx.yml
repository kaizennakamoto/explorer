version: '3.9'
services:
  proxy:
    image: nginx
    container_name: proxy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - "../proxy:/etc/nginx/templates"
      - "../proxy/static:/usr/share/nginx/static"
      - "../proxy/fullchain.pem:/etc/nginx/certs/fullchain.pem"
      - "../proxy/privkey.pem:/etc/nginx/certs/privkey.pem"
    environment:
      BACK_PROXY_PASS: ${BACK_PROXY_PASS:-http://backend:4000}
      FRONT_PROXY_PASS: ${FRONT_PROXY_PASS:-http://frontend:3000}
    ports:
      - target: 80
        published: 80
      - target: 8080
        published: 8080
      - target: 8081
        published: 8081
      - target: 8443
        published: 8443
      - target: 8444
        published: 8444
