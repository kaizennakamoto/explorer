version: '3.9'

services:
  frontend:
    image: ghcr.io/blockscout/frontend:${FRONTEND_DOCKER_TAG:-latest}
    pull_policy: always
    platform: linux/amd64
    restart: always
    container_name: 'frontend'
    volumes:
      - "../proxy/static/full_logo.svg:/app/public/static/full_logo.svg:ro"
    env_file:
      -  ../envs/common-frontend.env
